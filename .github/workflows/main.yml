name: Build installers

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $art = Join-Path $PWD "build\PuntoTunePro_artefacts\Release"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DBuildDir=$art" installer\windows\PuntoTunePro.iss
      - uses: actions/upload-artifact@v4
        with:
          name: PuntoTunePro-Windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Build installer
        run: |
          chmod +x installer/mac/build_pkg.sh
          installer/mac/build_pkg.sh build/PuntoTunePro_artefacts/Release
      - uses: actions/upload-artifact@v4
        with:
          name: PuntoTunePro-macOS
          path: dist/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*

